# Every project setting lives here. Paths are relative to the repo root.

seed: 42

paths:
  data_dir: data            # raw/ and processed/ parquet cache (not committed)
  results_dir: results      # CSVs, JSON, and charts behind reported numbers (committed)
  models_dir: models        # saved model files (not committed)

universe:
  file: configs/tickers/sp500.csv   # or configs/tickers/us_all.csv to scale up
  max_tickers: 100                  # null = use every ticker in the file
  selection: random                 # random (seeded) | first
  market_ticker: SPY                # benchmark for correlation features and the trading calendar

download:
  batch_size: 50                # tickers per yfinance request
  max_retries: 3                # extra attempts per batch after the first
  backoff_seconds: 5.0          # wait before retry k is backoff_seconds * 2**k
  pause_between_batches: 2.0    # seconds, to stay under Yahoo's rate limits
  timeout: 30                   # seconds per request
  refresh: false                # true = re-download tickers that are already cached

# Window lengths are in bars (one bar = one day for daily, five minutes for 5m data).
frequencies:
  daily:
    enabled: true
    interval: 1d
    start: "2015-01-01"
    end: "2026-10-01"           # exclusive; fixed so reruns see the same history
    min_history_bars: 750       # ~3 years of trading days
    max_ffill_bars: 3           # longest gap we fill by carrying the last price forward
    volume_z_mode: rolling      # compare volume to the previous N bars
    splits:
      train_end: "2022-12-31"
      val_end: "2024-06-30"     # test = everything after this date
  intraday:
    enabled: true
    interval: 5m
    period: 60d                 # Yahoo only serves ~60 days of 5-minute bars
    min_history_bars: 1500      # ~19 trading days of 78 bars
    max_ffill_bars: 6           # 30 minutes
    volume_z_mode: time_of_day  # compare to the same 5-minute slot on previous days
    splits:
      train_frac: 0.6           # by trading day, so no day is split across sets
      val_frac: 0.2

cleaning:
  max_missing_frac: 0.05        # drop a ticker missing more than 5% of trading bars
  max_zero_volume_frac: 0.05    # drop a ticker with more than 5% zero-volume bars
  split_tolerance: 0.05         # how close a split-day return must be to the split ratio to count as unadjusted
  min_split_ratio: 1.5          # only check real splits (>= 3:2 or <= 2:3); small ratios are stock dividends Yahoo already adjusts

features:
  vol_windows: [20]             # rolling volatility of log returns
  volume_z_window: 20           # bars (rolling mode)
  volume_z_days: 10             # days (time_of_day mode)
  corr_window: 60               # rolling correlation to the market ticker

# Phase 2: labeled anomalies. Built on daily data; intraday is used for the streaming test.
labels:
  frequency: daily
  inject_splits: [val, test]        # train stays untouched; thresholds are tuned on val, results reported on test
  synthetic:
    rate_per_1000_bars: 2.0         # expected events per anomaly type, per ticker, per 1000 bars
    min_gap_bars: 30                # spacing between events in one ticker, so their effects don't overlap
    vol_window: 20                  # magnitudes are multiples of the ticker's trailing volatility
    price_spike_sigma: [4.0, 10.0]  # one-bar jump, then back to normal
    volume_burst_factor: [4.0, 12.0]
    volume_burst_bars: [1, 3]
    level_shift_sigma: [4.0, 8.0]   # price jumps and stays there
    level_shift_label_bars: 5       # bars after the jump counted as part of the event
  real:
    large_move_sigma: 5.0           # |return| at least this many trailing-volatility units...
    large_move_min_abs: 0.08        # ...and at least 8% (log return)
    earnings_sigma: 3.0             # reaction-day |return| for an earnings day to count as a shock
    earnings_limit: 100             # quarters of earnings dates to fetch per ticker
    earnings_after_hour: 12         # announced at/after 12:00 ET, so the market reacts the next trading day

evaluation:
  grace_bars: 3                     # an alarm up to 3 bars after an event still counts as catching it; these bars are never false alarms
  tune_track: synthetic             # thresholds are tuned on the val split of this label track
  threshold_objective: f1           # f1 | fa_budget
  max_false_alarms_per_day_all_tickers: 1.0  # fa_budget only: false alarms per trading day summed over ALL tickers

# Phases 3-5: models. Every model trains on the train split and is tuned on val only.
models:
  feature_sets:
    base: [log_ret, vol_20, volume_z, gap, corr_market]
    # ret_z / gap_z = return / gap divided by the previous bar's vol_20 ("how many sigmas")
    base_plus_normalized: [log_ret, vol_20, volume_z, gap, corr_market, ret_z, gap_z]
  scaling: per_ticker               # per_ticker | global; statistics come from the train split only
  min_train_rows_per_ticker: 250    # tickers with fewer train rows use global statistics
  isolation_forest:
    grid:                           # every combination is tried; the best val PR-AUC wins
      feature_set: [base, base_plus_normalized]
      n_estimators: [100, 300]
      max_samples: [256, 2048]
    max_features: 1.0
    n_jobs: -1
  deep:                             # shared by the LSTM autoencoder and the Transformer
    feature_set: base_plus_normalized
    window: 20                      # bars of history per sample, ending at the scored bar
    holdout_frac: 0.1               # last 10% of TRAIN dates, for early stopping (val is never used for training)
    batch_size: 512
    max_epochs: 100                 # a ceiling; early stopping on the holdout normally ends training first
    patience: 5                     # stop after this many epochs without holdout improvement
    learning_rate: 0.001
    torch_threads: 4
    lstm_autoencoder:
      hidden_size: 32               # the original first-pass model, kept and reported as lstm_autoencoder_original
      hidden_size_grid: [4, 8, 16]  # tighter bottlenecks; the best val PR-AUC (tune_track) among these becomes lstm_autoencoder
      num_layers: 1
    transformer:
      d_model: 32
      n_heads: 4
      n_layers: 2
      ff_dim: 64
      dropout: 0.1
